[package]
name = "pressdock"
version = "0.1.0"
description = "News Editorial Workspace"
authors = ["PressDock contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pressdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "query", "charset", "system-proxy", "multipart"] }
tauri-plugin-opener = "2"
keyring = "4.2.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18"
oxipng = { version = "10.2", default-features = false }
exoquant = "0.2"
webp = { version = "0.3", default-features = false }
lcms2 = { version = "6.2", features = ["static"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
