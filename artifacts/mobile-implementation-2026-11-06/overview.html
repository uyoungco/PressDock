<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PressDock 手机端实装</title>
    <link rel="stylesheet" href="./overview.css" />
  </head>
  <body>
    <header>
      <p>PRESSDOCK / MOBILE</p>
      <h1>手机端实装</h1>
      <p>实际 React 页面 · 隔离演示数据 · 2026.11.06</p>
      <label
        >主题
        <select id="theme">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select></label
      >
    </header>
    <main>
      <figure>
        <figcaption>渠道素材</figcaption>
        <a href="./channels-light.png"
          ><img
            width="390"
            height="844"
            data-page="channels"
            src="./channels-light.png"
            alt="渠道素材的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>文章管理</figcaption>
        <a href="./articles-light.png"
          ><img
            width="390"
            height="844"
            data-page="articles"
            src="./articles-light.png"
            alt="文章管理的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>正文编辑</figcaption>
        <a href="./editor-light.png"
          ><img
            width="390"
            height="844"
            data-page="editor"
            src="./editor-light.png"
            alt="正文编辑的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>素材导入</figcaption>
        <a href="./import-light.png"
          ><img
            width="390"
            height="844"
            data-page="import"

        /></a>
      </figure>
      <figure>
        <figcaption>图片处理</figcaption>
        <a href="./image-light.png"
          ><img
            width="390"
            height="844"
            data-page="image"
            src="./image-light.png"
            alt="图片处理的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>系统设置</figcaption>
        <a href="./settings-light.png"
          ><img
            width="390"
            height="844"
            data-page="settings"
            src="./settings-light.png"
            alt="系统设置的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>AI 模型</figcaption>
        <a href="./models-light.png"
          ><img
            width="390"
            height="844"
            data-page="models"
            src="./models-light.png"
            alt="AI 模型的实际手机界面截图"
        /></a>
      </figure>
      <figure>
        <figcaption>文章筛选</figcaption>
        <a href="./article-filter-light.png"
          ><img
            width="390"
            height="844"
            data-page="article-filter"
            src="./article-filter-light.png"
            alt="文章筛选的实际手机界面截图"
        /></a>
      </figure>
    </main>
    <footer>
      本页展示代码实装结果；CMS、AI
      写入及图片编码未在浏览器内执行。真机安全区、键盘和触摸裁剪仍需原生验收。
    </footer>
    <script type="module" src="./overview.mjs"></script>
  </body>
</html>
