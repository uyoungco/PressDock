<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>系统设置实施前后对比 · 隔离演示</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #21242b;
        font:
          14px/1.6 "Microsoft YaHei",
          sans-serif;
      }
      main {
        max-width: 1600px;
        margin: auto;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        margin-top: 32px;
        font-size: 16px;
      }
      p,
      figcaption {
        color: #666d79;
      }
      a {
        color: #3659d9;
      }
      section > div {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      img {
        display: block;
        width: 100%;
        border: 1px solid #dfe2e7;
        border-radius: 6px;
      }
      figcaption {
        margin-bottom: 8px;
      }
      @media (max-width: 800px) {
        section > div {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
